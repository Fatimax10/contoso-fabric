# Pre-installs the toolchain into the Copilot cloud agent's ephemeral environment.
# Job name MUST be `copilot-setup-steps` for the agent to pick it up.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/src/web-next/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/src/worker-python/requirements-dev.txt

      - name: Restore .NET
        run: dotnet restore app/src/ContosoFabric.sln

      - name: Restore web
        working-directory: app/src/web-next
        run: npm ci

      - name: Restore worker
        working-directory: app/src/worker-python
        run: pip install -r requirements-dev.txt
